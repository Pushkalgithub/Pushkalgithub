name: Update GitHub Activity Chart

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution charts
        uses: dturovskiy/deus-commit-chart@v1
        with:
          username: Pushkalgithub
          token: ${{ github.token }}
          default-days: "365"
          ranges: "365"
          output-dir: activity-assets

      - name: Publish charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity-assets

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub activity chart"
            git push
          fi
